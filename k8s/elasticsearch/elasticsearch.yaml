# A three-node Elasticsearch cluster sized for a laptop. Security is disabled and
# the heap is small, so use this only as a local upgrade test environment.
apiVersion: v1
kind: Namespace
metadata:
  name: elasticsearch
---
# Headless Service: gives each pod a stable DNS name so nodes can find each other.
apiVersion: v1
kind: Service
metadata:
  name: es-discovery
  namespace: elasticsearch
spec:
  clusterIP: None
  # Nodes must discover each other before any of them is ready.
  publishNotReadyAddresses: true
  selector:
    app: elasticsearch
  ports:
    - name: transport
      port: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
---
# Stops voluntary evictions from taking down more than one node at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: elasticsearch
  namespace: elasticsearch
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: elasticsearch
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: es
  namespace: elasticsearch
spec:
  serviceName: es-discovery
  replicas: 3
  podManagementPolicy: Parallel
  # Kubernetes must not restart nodes by itself when the image changes.
  # dataops-guardian-es-upgrade restarts them one at a time.
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      # fsGroup does not apply to hostPath, so the snapshot folder needs its owner set.
      initContainers:
        - name: snapshot-permissions
          image: busybox:1.36
          command: ["chown", "-R", "1000:1000", "/snapshots"]
          volumeMounts:
            - name: snapshots
              mountPath: /snapshots
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
          env:
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: cluster.name
              value: guardian-upgrade-test
            - name: discovery.seed_hosts
              value: es-discovery
            - name: cluster.initial_master_nodes
              value: es-0,es-1,es-2
            - name: xpack.security.enabled
              value: "false"
            # Avoids needing a privileged init container to raise vm.max_map_count.
            - name: node.store.allow_mmap
              value: "false"
            - name: path.repo
              value: /snapshots
            - name: ES_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: snapshots
              mountPath: /snapshots
      # Every node must see the same repository. A hostPath only does that on a
      # one-machine test cluster; production needs shared or object storage.
      volumes:
        - name: snapshots
          hostPath:
            path: /var/lib/guardian-snapshots
            type: DirectoryOrCreate
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
