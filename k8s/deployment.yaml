
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataops-guardian
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dataops-guardian
  template:
    metadata:
      labels:
        app: dataops-guardian
    spec:
      containers:
        - name: dataops-guardian
          image: dataops-guardian:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: dataops-guardian-config
                  key: PORT
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: dataops-guardian-config
                  key: SERVICE_NAME
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: dataops-guardian-config
                  key: ELASTICSEARCH_URL

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10