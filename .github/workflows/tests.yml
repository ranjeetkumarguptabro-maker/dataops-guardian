
name: DataOps Guardian CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Format, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Run unit tests
        run: python -m pytest -v

  elasticsearch-integration:
    name: Elasticsearch Integration Test
    runs-on: ubuntu-latest

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 60s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Wait for Elasticsearch
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:9200/ >/dev/null; then
              echo "Elasticsearch is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Elasticsearch did not become ready in time"
          exit 1

      - name: Run live integration test
        env:
          ELASTICSEARCH_INTEGRATION_TESTS: "1"
          ELASTICSEARCH_URL: http://localhost:9200
          ELASTICSEARCH_EXPECTED_VERSION: "8.17.4"
        run: python -m pytest -v tests/test_elasticsearch_integration.py

  docker:
    name: Build and Test Docker Images
    runs-on: ubuntu-latest
    needs: [test, elasticsearch-integration]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: test
          tags: dataops-guardian:test
          load: true
          cache-from: type=gha,scope=docker-test
          cache-to: type=gha,mode=max,scope=docker-test

      - name: Run tests inside Docker
        run: docker run --rm dataops-guardian:test

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          tags: dataops-guardian:local
          load: true
          cache-from: type=gha,scope=docker-production
          cache-to: type=gha,mode=max,scope=docker-production

      # The production image is a long-running server, so check it over HTTP.
      - name: Verify production image
        run: |
          docker run -d --name guardian -p 8080:8080 dataops-guardian:local
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health; then
              docker rm -f guardian
              exit 0
            fi
            sleep 2
          done
          docker logs guardian
          docker rm -f guardian
          exit 1

  kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Helm chart
        run: helm lint helm/dataops-guardian

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: guardian

      - name: Build and load production image
        run: |
          docker build --target production -t dataops-guardian:local .
          kind load docker-image dataops-guardian:local --name guardian

      - name: Deploy Elasticsearch for Kubernetes tests
        run: |
          kubectl apply -f k8s/ci/elasticsearch.yaml
          kubectl rollout status deployment/elasticsearch -n elasticsearch --timeout=180s

      - name: Install chart and wait for readiness
        run: |
          helm install dataops-guardian helm/dataops-guardian \
            --wait --timeout 120s

      - name: Verify the Service responds
        run: |
          kubectl port-forward service/dataops-guardian 18080:80 &
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:18080/health; then
              exit 0
            fi
            sleep 2
          done
          kubectl describe pods -l app=dataops-guardian
          exit 1
