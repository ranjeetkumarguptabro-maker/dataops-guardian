
name: DataOps Guardian CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Format, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Run unit tests
        run: python -m pytest -v

  elasticsearch-integration:
    name: Elasticsearch Integration Test
    runs-on: ubuntu-latest

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 60s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Wait for Elasticsearch
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:9200/ >/dev/null; then
              echo "Elasticsearch is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Elasticsearch did not become ready in time"
          exit 1

      - name: Run live integration test
        env:
          ELASTICSEARCH_INTEGRATION_TESTS: "1"
          ELASTICSEARCH_URL: http://localhost:9200
          ELASTICSEARCH_EXPECTED_VERSION: "8.17.4"
        run: python -m pytest -v tests/test_elasticsearch_integration.py

  docker:
    name: Build and Test Docker Images
    runs-on: ubuntu-latest
    needs: [test, elasticsearch-integration]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: test
          tags: dataops-guardian:test
          load: true
          cache-from: type=gha,scope=docker-test
          cache-to: type=gha,mode=max,scope=docker-test

      - name: Run tests inside Docker
        run: docker run --rm dataops-guardian:test

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          tags: dataops-guardian:local
          load: true
          cache-from: type=gha,scope=docker-production
          cache-to: type=gha,mode=max,scope=docker-production

      - name: Verify production image
        run: docker run --rm dataops-guardian:local
