name: Platform End-to-End

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/dataguardian/elasticsearch.py"
      - "src/dataguardian/es_upgrade*.py"
      - "src/dataguardian/upgrade_*.py"
      - "k8s/elasticsearch/**"
      - "scripts/e2e_es_upgrade.sh"
      - "scripts/es_probe.py"
      - ".github/workflows/platform-e2e.yml"

jobs:
  elasticsearch-rolling-upgrade:
    name: Elasticsearch Rolling Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Elasticsearch stops placing replicas above 85% disk use, and three versions
      # of its image nearly fill a standard runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DataOps Guardian
        run: python -m pip install .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: guardian

      - name: Run upgrade test
        run: ./scripts/e2e_es_upgrade.sh

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl -n elasticsearch get pods -o wide || true
          kubectl -n elasticsearch describe pods -l app=elasticsearch | tail -60 || true
          kubectl -n elasticsearch logs -l app=elasticsearch --tail=40 || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-upgrade-reports
          path: reports/
