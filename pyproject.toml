[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataops-guardian"
version = "0.1.0"
description = "Automation toolkit for service health checks and safe platform maintenance"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dataops-guardian = "dataguardian.preflight:main"
dataops-guardian-maintenance = "dataguardian.maintenance_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "coverage[toml]>=7.6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["dataguardian"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
