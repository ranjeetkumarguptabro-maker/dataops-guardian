
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataops-guardian"
version = "0.1.0"
description = "Automation toolkit for service health checks and safe platform maintenance"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dataops-guardian = "dataguardian.preflight:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
